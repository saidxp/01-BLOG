# Needed for WebSocket: sets "Connection" correctly for WebSocket and normal requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Layer 1 EDGE rate limiting (coarse flood guard, keyed by client IP).
# Its only job is to absorb bot/DDoS floods BEFORE Spring. Real users never hit these
# numbers; fine-grained per-user fairness (login 5/min, etc.) lives in the app (Layer 2).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
# Return 429 (like the app) instead of nginx's default 503, so the frontend handles it the same way.
limit_req_status 429;

# HTTP: redirect traffic to HTTPS
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {

    listen 443 ssl;
    server_name _;

    # Resolver = Docker's embedded DNS (127.0.0.11): a fixed address present in EVERY
    # container, independent of the host network/subnet, so it works wherever this runs.
    # (A hardcoded subnet gateway like 10.89.0.1 breaks when the compose network is
    # recreated on a different subnet, causing stale-IP 502s.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Never leak the raw nginx error page to users: hide the version and serve a
    # friendly branded fallback instead of the default "502/503/504 Bad Gateway nginx".
    server_tokens off;
    error_page 502 503 504 @maintenance;

    # Friendly maintenance page. Status stays 503 so the Angular error interceptor
    # still recognises it as a failure (app shows its own error UI); a direct page
    # load sees this clean screen, never the nginx default.
    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01Blog - Temporarily unavailable</title><style>html,body{height:100%}body{margin:0;display:grid;place-items:center;background:#f6f6f4;color:#1c1c1c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.card{max-width:30rem;padding:2.5rem;text-align:center;background:#ffffff;border:1px solid #e2e2e0;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}.brand{font-weight:800;letter-spacing:-.03em;color:#3b5bdb;margin-bottom:1rem}h1{font-size:1.4rem;margin:0 0 .75rem}p{margin:0;color:#6b6b66;line-height:1.5}</style></head><body><div class="card"><div class="brand">01Blog</div><h1>We will be right back</h1><p>The service is temporarily unavailable. Please try again in a short moment.</p></div></body></html>';
    }

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Match the backend's spring.servlet.multipart.max-request-size (10MB) for
    # consistency across the proxy and the app.
    client_max_body_size 10m;

    # Frontend
    
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints: tightest edge guard (still far looser than the app's per-user 5/min)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (general): coarse flood guard
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media
    location /media/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (SockJS + STOMP) - one block handles /ws and /ws/...
    location /ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

}