# Needed for WebSocket: sets "Connection" correctly for WebSocket and normal requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Layer 1 EDGE rate limiting (coarse flood guard, keyed by client IP).
# Its only job is to absorb bot/DDoS floods BEFORE Spring. Real users never hit these
# numbers; fine-grained per-user fairness (login 5/min, etc.) lives in the app (Layer 2).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
# Return 429 (like the app) instead of nginx's default 503, so the frontend handles it the same way.
limit_req_status 429;

# HTTP: redirect traffic to HTTPS
server {
    listen 80;
    server_name 192.168.11.235 localhost;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {

    listen 443 ssl;
    server_name 192.168.11.235 localhost;

    resolver 10.89.0.1 valid=10s ipv6=off;
    resolver_timeout 5s;
    
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Match the backend's spring.servlet.multipart.max-request-size (10MB) for
    # consistency across the proxy and the app.
    client_max_body_size 10m;

    # Frontend
 
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Auth endpoints: tightest edge guard (still far looser than the app's per-user 5/min)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (general): coarse flood guard
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media
    location /media/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (SockJS + STOMP) - one block handles /ws and /ws/...
    location /ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

}