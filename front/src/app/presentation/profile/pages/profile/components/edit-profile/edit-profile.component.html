<form class="edit-profile-form" [formGroup]="form" (ngSubmit)="submit()">
  <label for="bio">Bio</label>
  <textarea id="bio" class="form-control" formControlName="bio" rows="4" maxlength="300"></textarea>

  <label for="avatar">Avatar</label>
  <input id="avatar" class="form-control" type="file" accept="image/*" (change)="onAvatarSelected($event)" />

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <div class="form-actions">
    <button class="button-01 button-01--secondary" type="button" (click)="cancel()" [disabled]="isSubmitting()">Cancel</button>
    <button class="button-01 button-01--primary" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
