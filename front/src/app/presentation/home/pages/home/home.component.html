 
<!-- home.component.html -->

@if (!currentUser()) {
  <div class="guest-banner">
    <span>Log in to like, comment, and post.</span>
  </div>
}

@if (currentUser()) {
  <div class="feed-navigation">
    <button
      type="button"
      (click)="showPrivatePosts.set(true)"
      [class.active]="showPrivatePosts()"
    >
      Following
    </button>

    <button
      type="button"
      (click)="showPrivatePosts.set(false)"
      [class.active]="!showPrivatePosts()"
    >
      Explore
    </button>
  </div>
}

@if (showPrivatePosts() && currentUser()) {
  <app-private-posts-feed />
} @else {
  <app-public-posts-feed />
}
