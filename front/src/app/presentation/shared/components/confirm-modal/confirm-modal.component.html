@if (isOpen()) {
  <div class="modal-backdrop" (click)="cancel()">
    <section #dialog class="modal-content" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message" tabindex="-1" (click)="$event.stopPropagation()" (keydown)="onDialogKeydown($event)">
      <div class="modal-icon" aria-hidden="true">!</div>
      <div class="modal-copy">
        <h2 id="confirm-dialog-title">{{ title() }}</h2>
        <p id="confirm-dialog-message">{{ message() }}</p>
      </div>
      <div class="modal-actions">
        <button class="button-01 button-01--secondary" type="button" (click)="cancel()">Cancel</button>
        <button class="button-01 modal-confirm" type="button" (click)="confirmed.emit()">Confirm</button>
      </div>
    </section>
  </div>
}
