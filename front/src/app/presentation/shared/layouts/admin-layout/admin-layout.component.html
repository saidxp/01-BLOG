<div class="admin-layout">
  <svg class="admin-waves" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" class="wave-stop-a" />
        <stop offset="0.5" class="wave-stop-b" />
        <stop offset="1" class="wave-stop-a" />
      </linearGradient>
      <path id="wavePath" d="M0 0 Q 90 -26 180 0 T 360 0 T 540 0 T 720 0 T 900 0 T 1080 0 T 1260 0 T 1440 0 T 1620 0 T 1800 0 T 1980 0 T 2160 0 T 2340 0 T 2520 0 T 2700 0 T 2880 0" />
    </defs>
    <g transform="translate(0 80)"><use href="#wavePath" class="wave-line wave-1" /></g>
    <g transform="translate(-140 200)"><use href="#wavePath" class="wave-line wave-2" /></g>
    <g transform="translate(60 320)"><use href="#wavePath" class="wave-line wave-3" /></g>
    <g transform="translate(-220 440)"><use href="#wavePath" class="wave-line wave-4" /></g>
    <g transform="translate(30 560)"><use href="#wavePath" class="wave-line wave-5" /></g>
  </svg>
  <aside class="admin-sidebar" aria-label="Administration navigation">
    <div class="admin-sidebar__brand">
      <a routerLink="/" class="admin-brand" aria-label="01Blog home">
        <span class="admin-brand__mark" aria-hidden="true">01</span>
        <span>Blog</span>
      </a>
      <a routerLink="/admin" routerLinkActive="active" class="admin-label" aria-label="Admin dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><title>shield-outline</title><path fill="currentColor" d="M12 20.962q-3.014-.895-5.007-3.651T5 11.1V5.692l7-2.615l7 2.615V11.1q0 3.454-1.993 6.21T12 20.963m0-1.062q2.6-.825 4.3-3.3t1.7-5.5V6.375l-6-2.23l-6 2.23V11.1q0 3.025 1.7 5.5t4.3 3.3m0-7.88"/></svg>
      </a>
    </div>

    <nav class="admin-nav">
      <a routerLink="/admin/users" routerLinkActive="active">Users</a>
      <a routerLink="/admin/posts" routerLinkActive="active">Posts</a>
      <a routerLink="/admin/reports" routerLinkActive="active">Reports</a>
    </nav>

    <a routerLink="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>go-back</title><path fill="currentColor" fill-rule="evenodd" d="m2.87 7.75l1.97 1.97a.75.75 0 1 1-1.06 1.06L.53 7.53L0 7l.53-.53l3.25-3.25a.75.75 0 0 1 1.06 1.06L2.87 6.25h9.88a3.25 3.25 0 0 1 0 6.5h-2a.75.75 0 0 1 0-1.5h2a1.75 1.75 0 1 0 0-3.5z" clip-rule="evenodd"/></svg> Back to site</a>
    <button class="back-link logout-button" type="button" (click)="logout()" [disabled]="isLoggingOut()">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><title>sign-out</title><g fill="none"><path fill="currentColor" d="M10.26 7.42c0-1.51 0-2.26.43-2.8c.43-.55 1.16-.73 2.62-1.09l2.12-.52c2.28-.56 3.42-.84 4.19-.23c.76.6.76 1.77.76 4.12v10.49c0 2.23 0 3.34-.72 3.94s-1.82.4-4 0l-2.13-.4c-1.56-.3-2.34-.44-2.8-1c-.47-.55-.47-1.35-.47-2.94z" opacity=".2"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m6.04 8.34l-.83.83c-1.34 1.33-2 2-2 2.83s.66 1.5 2 2.83l.83.83M14.43 12H3.68m6.58-5.65v-.2a3 3 0 0 1 2.54-2.88l1.56-.3c2.25-.44 3.37-.66 4.23-.28a3 3 0 0 1 1.26 1.04c.53.77.53 1.92.53 4.2v8.44c0 2.19 0 3.28-.5 4.04a3 3 0 0 1-1.2 1.04c-.82.39-1.9.24-4.07-.07l-1.37-.2l-.73-.12a3 3 0 0 1-2.23-2.57c-.02-.17-.02-.36-.02-.74"/></g></svg>
      {{ isLoggingOut() ? 'Signing out…' : 'Log out' }}
    </button>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
