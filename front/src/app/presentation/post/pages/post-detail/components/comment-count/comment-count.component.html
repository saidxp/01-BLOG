<div
  class="comment-count"
  [attr.aria-label]="commentCount() + (commentCount() === 1 ? ' comment' : ' comments')"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-4-.9L3 21l1.6-4.3A8.2 8.2 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.5 8.4 8.4 0 0 1 9 8.5Z" />
  </svg>
  <span>Comments</span>
  <strong>{{ commentCount() }}</strong>
</div>
