name: 01-blog
services:
  postgres:
    image: postgres:15-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
      POSTGRES_USER: ${POSTGRES_USER:-bloguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    networks:
      - app-net
    ports:
      - "1337:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/// short-circuit with 403 so no action can be performed with this token.data
    restart: unless-stopped 
  nginx: 
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "1998:80"
      - "8443:443"
    networks:
      - app-net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blog-backend:latest
    container_name: blog-backend
    ports: 
      - "2000:8080"
    networks:
      - app-net
    depends_on:
      - postgres
    volumes:
      - blog_media:/app/uploads/media
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
      POSTGRES_USER: ${POSTGRES_USER:-bloguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      # Set COOKIE_SECURE=true when serving over HTTPS (nginx prod setup)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Comma-separated usernames auto-promoted to ADMIN on startup
      BOOTSTRAP_ADMIN_USERNAMES: ${BOOTSTRAP_ADMIN_USERNAMES:-}
      # Enable with: SPRING_PROFILES_ACTIVE=prod (forces Secure cookies + no show-sql)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    restart: unless-stopped
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: blog-frontend:latest 
    container_name: blog-frontend 
    networks:
      - app-net
    expose: 
      - "4000" 
    restart: unless-stopped 
volumes:
  postgres_data:
  blog_media:

networks:        # <-- root level
  app-net:
    driver: bridge