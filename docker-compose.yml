name: 01-blog
services:
  postgres:
    image: postgres:15-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
      POSTGRES_USER: ${POSTGRES_USER:-bloguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    networks:
      - app-net
    ports:
      - "1337:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped 
  nginx: 
    image: nginx:alpine
    container_name: blog-nginx
    ports:
      - "1998:80"
      - "8443:443"
    networks:
      - app-net
    volumes:
      # Mounted as a TEMPLATE: the official nginx entrypoint runs envsubst on it at
      # startup and writes the result to /etc/nginx/conf.d/default.conf. The only
      # substituted variable is NGINX_RESOLVER_IP (exported by the command below).
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # Runtime-agnostic DNS: read the container's first nameserver (Docker embedded DNS
    # 127.0.0.11, Podman aardvark-dns, anything else) and hand it to the template.
    # $$$$-doubled signs are compose escapes so the shell receives plain $ at runtime.
    command:
      - sh
      - -c
      - |-
        IP=$$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf)
        export NGINX_RESOLVER_IP=$${IP:-127.0.0.11}
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blog-backend:latest
    container_name: blog-backend
    ports: 
      - "2000:8080"
    networks:
      - app-net
    depends_on:
      - postgres
    volumes:
      - blog_media:/app/uploads/media
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
      POSTGRES_USER: ${POSTGRES_USER:-bloguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      # Set COOKIE_SECURE=true when serving over HTTPS (nginx prod setup)
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Comma-separated usernames auto-promoted to ADMIN on startup
      BOOTSTRAP_ADMIN_USERNAMES: ${BOOTSTRAP_ADMIN_USERNAMES:-}
      # Seed password used only when the runner must CREATE a missing admin (default: ChangeMe123!)
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      # Enable with: SPRING_PROFILES_ACTIVE=prod (forces Secure cookies + no show-sql)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Public host/port (single source of truth for CORS + WebSocket allowed origin)
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-8443}
    restart: unless-stopped
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: blog-frontend:latest 
    container_name: blog-frontend 
    networks:
      - app-net
    expose: 
      - "4000" 
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Public host (single source of truth for SSR allowedHosts in server.ts)
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-8443}
    restart: unless-stopped 
volumes:
  postgres_data:
  blog_media:

networks:        # <-- root level
  app-net:
    driver: bridge