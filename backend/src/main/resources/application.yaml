spring:
  application:
    name: backend 

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB 

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:blogdb}
    username: ${POSTGRES_USER:bloguser}
    password: ${POSTGRES_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  forward-headers-strategy: framework  
app:
  base-url: http://localhost:8080
  # Auth cookie Secure flag: false for local HTTP, overridden to true in the prod profile
  cookie:
    secure: ${COOKIE_SECURE:false}
  # Comma-separated usernames promoted to ADMIN at startup (empty disables bootstrapping)
  bootstrap-admin-usernames: ${BOOTSTRAP_ADMIN_USERNAMES:}
  # Layer 2 rate limiting (Bucket4j): one global box per user/IP + one door box per matched rule
  ratelimit:
    enabled: true
    global-capacity: 100
    global-refill-per-minute: 100
    rules:
      - name: auth
        methods: []
        match: /api/auth/**
        capacity: 5
        refill-per-minute: 5
      - name: write
        methods: [POST, PUT, DELETE, PATCH]
        match: /api/**
        capacity: 20
        refill-per-minute: 20
      - name: read
        methods: [GET]
        match: /api/**
        capacity: 60
        refill-per-minute: 60
jwt: 
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.springframework.messaging.simp.user: TRACE
    org.springframework.messaging.simp.broker: TRACE

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/v3/api-docs

---
# Production profile: cookies only over HTTPS, no SQL echo, quieter security logs
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

app:
  cookie:
    secure: true

logging:
  level:
    org.springframework.security: INFO