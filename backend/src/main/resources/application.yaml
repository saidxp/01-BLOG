spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:1337/blogdb
    username: bloguser
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_EXPIRATION:86400000}


logging:
  level:
    org.springframework.security: DEBUG