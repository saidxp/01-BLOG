spring:
  application:
    name: backend 

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB 

  datasource:
    url: jdbc:postgresql://postgres:5432/blogdb
    username: bloguser
    password: 1234 

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    
app:
  base-url: http://localhost:8080 
jwt: 
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.springframework.messaging.simp.user: TRACE
    org.springframework.messaging.simp.broker: TRACE

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/v3/api-docs